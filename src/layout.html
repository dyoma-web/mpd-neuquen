<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#24505C">
<meta name="mpd-version" content="{{version}}">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="preload" href="assets/fonts/atkinson-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="assets/fonts/lexend-600.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="assets/css/proto.css">
<link rel="stylesheet" href="assets/css/site.css">
<script>
  // Dentro de un iframe (instalación con ventana.js) se ocultan las herramientas del prototipo.
  if (window.top !== window || /[?&]embed=1/.test(location.search)) document.documentElement.classList.add('proto-embed');
</script>
</head>
<body data-page="{{page}}" class="{{bodyClass}}">
<a class="skip" href="#contenido">Saltar al contenido</a>
{{main}}
{{protoNav}}
<script>
  // Modo revisión (comentarios en vivo). Clave pública: el acceso real lo controla el código de sesión.
  window.MPD_REVIEW = {{reviewConfig}};
</script>
<script src="assets/js/data.js" defer></script>
<script src="assets/js/chat.js" defer></script>
<script src="assets/js/app.js" defer></script>
<script src="assets/js/review.js" defer></script>
{{scripts}}
</body>
</html>
